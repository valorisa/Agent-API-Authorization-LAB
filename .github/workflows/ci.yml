name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e ".[test]"

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Run tests
        run: pytest -q

  markdownlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install markdownlint
        run: npm install --global markdownlint-cli@0.49.1

      - name: Lint Markdown
        run: markdownlint README.md docs/EXPERIMENT.md
